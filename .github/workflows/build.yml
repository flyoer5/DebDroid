name: Build APK

# DebDroid v2 CI（architecture.md §6）：
# 1) 单元测试门禁（失败即红） 2) 注入 arm64 rootfs/proot 资产
# 3) 正式签名 Release 构建 4) 产物归档 + tag 自动发 Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ---- 单元测试门禁（FR-Q1）：失败即中止构建 ----
      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          retention-days: 3
          path: app/build/reports/tests/

      - name: Restore rootfs cache
        uses: actions/cache@v4
        with:
          path: .rootfs-cache
          key: rootfs-trixie-v2-${{ hashFiles('scripts/fetch_rootfs.sh') }}

      - name: Fetch Debian 13 rootfs (arm64 only)
        run: |
          chmod +x gradlew scripts/fetch_rootfs.sh scripts/fetch_proot.sh
          ./scripts/fetch_rootfs.sh app/src/main/assets/rootfs.tar.xz

      - name: Fetch Termux proot runtime (arm64 only)
        run: |
          ./scripts/fetch_proot.sh app/src/main/assets/proot.tar

      - name: Provision rootfs (tmux + openssh-server via qemu chroot)
        run: |
          chmod +x scripts/provision_rootfs.sh
          ./scripts/provision_rootfs.sh app/src/main/assets/rootfs.tar.xz

      - name: Build arm64 APK (release, signed)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon -PversionCode=${{ github.run_number }}

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DebDroid-APKs
          path: out/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
